<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="chaordichris home">chaordichris</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">About</a>
          <a href="{{ '/writing/' | relative_url }}">Writing / Blog</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
        </nav>
        <nav class="social-nav" aria-label="Social links">
          <a href="{{ site.x_url }}" rel="me">X</a>
          <a href="{{ site.github_url }}" rel="me">GitHub</a>
        </nav>
      </header>

      <main{% if page.layout == 'post' %} class="article"{% endif %}>
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>chaordichris</p>
        <p><a href="{{ site.x_url }}" rel="me">X</a><span aria-hidden="true"> · </span><a href="{{ site.github_url }}" rel="me">GitHub</a></p>
      </footer>
    </div>
  </body>
</html>
